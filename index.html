<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Task Manager</h1>
    <p class="subtitle">Plan your day. Your tasks are saved in this browser.</p>

    <!-- Add task form -->
    <form id="task-form" class="task-form">
      <input id="task-title" type="text" placeholder="What do you need to do?" maxlength="100" required>
      <select id="task-priority" aria-label="Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input id="task-due" type="date" aria-label="Due date">
      <button type="submit">Add</button>
    </form>

    <!-- Search and filters -->
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search tasks...">
      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
    </div>

    <!-- Task list -->
    <ul id="task-list" class="task-list"></ul>
    <p id="empty-message" class="empty" hidden>No tasks to show.</p>

    <!-- Footer -->
    <div class="footer">
      <span id="counter"></span>
      <button id="clear-completed" class="link-button">Clear completed</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
